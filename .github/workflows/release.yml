name: Build and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml', 'scripts/smoke-container.mjs']
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: stageforce-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run typecheck && npm run build
      - name: Check source-only release and select image
        id: meta
        run: |
          node scripts/check-source.mjs
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const version=JSON.parse(readFileSync('package.json')).version;
          if(process.env.GITHUB_REF_TYPE==='tag'&&process.env.GITHUB_REF_NAME!=='v'+version)throw Error('Tag must match package version');
          appendFileSync(process.env.GITHUB_OUTPUT,`image=ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}\nversion=${version}\n`);
          JS
      # A version is published once. If it already exists (a push that did not bump package.json),
      # nothing is rebuilt; only :latest is pointed at that version.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; not rebuilding it. Bump package.json for a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and smoke-test image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker build -t stageforce:test .
          node scripts/smoke-container.mjs stageforce:test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The server pins the exact version tag (see docs/release.md); :latest is a convenience
          # that always follows the newest release.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
      - name: Point latest at the existing release
        if: steps.existing.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Stage Force $VERSION" --notes-file docs/release-notes.md
