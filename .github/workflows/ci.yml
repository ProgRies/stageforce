name: Check Stage Force
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate Compose deployment files
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f compose.local.yaml config --quiet
          docker compose --env-file .env.example config --format json > /tmp/stageforce-compose.json
          node scripts/check-compose.mjs /tmp/stageforce-compose.json
      - run: npm ci --ignore-scripts
      - run: node scripts/check-source.mjs
      - run: npm test && npm run typecheck && npm run build
      - run: docker build -t stageforce:test .
      - run: node scripts/smoke-container.mjs stageforce:test
