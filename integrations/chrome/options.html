<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Connect Stage Force</title><link rel="stylesheet" href="options.css"><main><h1>Connect Stage Force</h1><p>In the CRM: Settings → Browser-Erweiterung verbinden → Schlüssel erstellen.</p><form><label>CRM address<input id="origin" type="url" value="http://localhost:3000" required></label><label>Your personal connection key<input id="token" type="password" placeholder="sf_ext_…" autocomplete="off" required></label><button>Connect</button></form><p id="status" role="status"></p><button id="disconnect" type="button">Disconnect this browser</button><p class="note">Each colleague uses their own CRM account and key. This key is kept in this browser profile, never synced. Disconnecting removes it here; revoke it in CRM settings to invalidate it everywhere.</p></main><script src="options.js"></script></html>
