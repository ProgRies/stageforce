# Isolated local demo. Never use this configuration on a public server.
services:
  crm:
    image: stageforce:0.3.10-local
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      APP_URL: http://localhost:3000
      # Company domains whose addresses (aliases included) count as colleagues, not clients.
      INTERNAL_DOMAINS: stage.bio,jaimo-solutions.com
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - demo-storage:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  demo-storage:
